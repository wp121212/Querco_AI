
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:transparent}
.header{background:#102A3D;padding:14px 20px;display:flex;align-items:center;gap:12px;border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 0}
.logo{color:#fff;font-size:17px;font-weight:500;letter-spacing:-0.3px}
.badge{background:#1a3f5c;color:#7fb5d5;font-size:11px;padding:3px 9px;border-radius:4px;font-weight:500}
.upload-zone{border:1.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:32px;text-align:center;cursor:pointer;margin:16px;transition:all 0.2s;background:var(--color-background-secondary)}
.upload-zone:hover{border-color:#102A3D;background:var(--color-background-primary)}
.upload-loaded{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--color-background-success);border-radius:var(--border-radius-md);margin:12px 16px;font-size:13px;color:var(--color-text-success)}
.section{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px 20px;margin:0 16px 10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:14px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:8px}
.sec-num{background:#102A3D;color:#fff;width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.opt-label{font-size:11px;color:var(--color-text-tertiary)}
.toggle{width:38px;height:20px;border-radius:10px;border:none;cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0}
.toggle-dot{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left 0.2s}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.field-full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px;letter-spacing:0.1px}
input,textarea,select{width:100%;font-size:13px;color:var(--color-text-primary);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:7px 10px;font-family:var(--font-sans);transition:border-color 0.15s;outline:none}
input:focus,textarea:focus{border-color:#102A3D}
textarea{min-height:80px;resize:vertical}
.gen-btn{display:block;width:calc(100% - 32px);margin:4px 16px 16px;padding:13px;background:#102A3D;color:#fff;border:none;border-radius:var(--border-radius-lg);font-size:14px;font-weight:500;cursor:pointer;transition:background 0.2s;font-family:var(--font-sans)}
.gen-btn:hover{background:#1a3f5c}
.gen-btn:disabled{background:#8ba3b8;cursor:not-allowed}
.status{text-align:center;font-size:12px;color:var(--color-text-secondary);padding:8px;margin:0 16px 8px}
.disabled-section{opacity:0.45;pointer-events:none}
</style>

<div class="section">

  <div class="field-grid">
    <div><label>Powierzchnia zabudowy [m²]</label><input id="building_footprint" placeholder="12 000"></div>

</div>

  <div class="sec-head">

      <span class="sec-num">4</span> Dochody / Najemcy
      <span class="opt-label">(opcjonalny)</span>
    </div>
    <button class="toggle" id="toggle4" onclick="toggleSlide('slide4','toggle4','sec4-fields')" style="background:#102A3D">
      <div class="toggle-dot" style="left:20px"></div>
    </button>
  </div>
  <div id="sec4-fields" class="field-grid">
    <div><label>Liczba najemców</label><input id="num_tenants" placeholder="5"></div>
    <div><label>Poziom wynajęcia</label><input id="occupancy" placeholder="95%"></div>

  <div class="sec-head"><div class="sec-title"><span class="sec-num">5</span> MPZP</div></div>
  <div class="field-grid">
    <div class="field-full"><label>Nr uchwały MPZP</label><input id="mpzp_resolution" placeholder="UCHWAŁA NR XXIII/456/2020 z dnia 15 września 2020 r."></div>

<button class="gen-btn" id="gen-btn" onclick="generatePptx()">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
var templateBuffer = null;
var slide4Active = true;

function handleDrop(e){
  e.preventDefault();
  document.getElementById('drop-zone').style.borderColor='';
  var f=e.dataTransfer.files[0];
  if(f) loadTemplate(f);
}

function loadTemplate(file){
  if(!file||!file.name.endsWith('.pptx')){setStatus('Wrzuć plik .pptx');return;}
  var r=new FileReader();
  r.onload=function(e){
    templateBuffer=e.target.result;
    document.getElementById('upload-area').style.display='none';
    document.getElementById('loaded-bar').style.display='flex';
    document.getElementById('loaded-name').textContent=file.name;
    document.getElementById('form-area').style.display='block';
  };
  r.readAsArrayBuffer(file);
}

function resetTemplate(){
  templateBuffer=null;
  document.getElementById('upload-area').style.display='block';
  document.getElementById('loaded-bar').style.display='none';
  document.getElementById('form-area').style.display='none';
  document.getElementById('file-input').value='';
}

function toggleSlide(slideKey,toggleId,fieldsId){
  slide4Active=!slide4Active;
  var t=document.getElementById(toggleId);
  var f=document.getElementById(fieldsId);
  t.style.background=slide4Active?'#102A3D':'#ccc';
  t.querySelector('.toggle-dot').style.left=slide4Active?'20px':'2px';
  f.style.opacity=slide4Active?'1':'0.4';
  f.style.pointerEvents=slide4Active?'auto':'none';
}

function val(id){return document.getElementById(id).value.trim();}

function replaceAll(str,find,rep){
  if(!find||find===rep)return str;
  while(str.indexOf(find)!==-1) str=str.replace(find,rep);
  return str;
}

function processSlide1(xml){
  var name=val('broker_name');
  var parts=name.split(' ');
  var first=parts[0]||'';
  var last=parts.slice(1).join(' ')||'';
  xml=xml.replace(/>Imię i </,'>'+first+' <');
  xml=xml.replace(/>Naziwsko</,'>'+last+'<');
  xml=xml.replace(/> brokera</,'><');
  xml=replaceAll(xml,'>Email<','>'+val('broker_email')+'<');
  xml=replaceAll(xml,'>Numer telefonu<','>'+val('broker_phone')+'<');
  return xml;
}

function processSlide2(xml){
  var city=val('city'); var street=val('street');
  xml=xml.replace(/&#x201E;Miasto&#x201D;|„Miasto"/g,city);
  xml=xml.replace(/UL\. &#x201E;ulica[^<]*/g,street);
  xml=xml.replace(/UL\. „ulica[^<]*/g,street);

  var tbl1=[val('land_area'),val('plot_number'),val('precinct'),val('commune'),val('county'),val('ownership')];
  var tbl2=[val('price_pln')];
  var tblIdx=0;
  xml=xml.replace(/<a:tbl[\s\S]*?<\/a:tbl>/g,function(m){
    tblIdx++;
    if(tblIdx===1){
      var ri=0;
      return m.replace(/<a:tr[\s\S]*?<\/a:tr>/g,function(row){
        var v=tbl1[ri++];
        if(v) return row.replace(/>TEKST</,'>'+v+'<');
        return row;
      });
    }
    if(tblIdx===2){
      return m.replace(/>TEKST</,'>'+tbl2[0]+'<');
    }
    return m;
  });

  var di=0;
  var dists=[val('dist_airport'),val('dist_expressway'),val('dist_port'),val('dist_highway'),val('dist_railway')];
  xml=xml.replace(/>X KM</g,function(){
    var v=dists[di++];
    return '>'+(v?v+' KM':'-')+'<';
  });
  xml=xml.replace(/>X M</,'>'+( val('dist_transit')?val('dist_transit')+' M':'-')+'<');

  var desc=val('description').split('\n').filter(Boolean);
  xml=xml.replace(/>Krótko opis nieruchomości[^<]*/,'>'+( desc[0]||''));
  xml=xml.replace(/>W pierwszym akapicie[^<]*/,'>'+(desc[0]||''));
  xml=xml.replace(/>W drugim akapicie opis lokalizacji</,'>'+(desc[1]||'')+'<');
  xml=xml.replace(/>W trzecim akapicie opis zabudowy</,'>'+(desc[2]||'')+'<');
  return xml;
}

function processSlide3(xml){
  var city=val('city'); var street=val('street');
  xml=xml.replace(/&#x201E;Miasto&#x201D;|„Miasto"/g,city);
  xml=xml.replace(/UL\. &#x201E;ulica[^<]*/g,street);
  xml=xml.replace(/UL\. „ulica[^<]*/g,street);
  var tbl1=[val('building_footprint'),val('total_area'),val('parking_spots'),val('warehouse_area'),val('office_area'),val('year_modernization')];
  var tblIdx=0;
  xml=xml.replace(/<a:tbl[\s\S]*?<\/a:tbl>/g,function(m){
    tblIdx++;
    if(tblIdx===1){var ri=0;return m.replace(/<a:tr[\s\S]*?<\/a:tr>/g,function(row){var v=tbl1[ri++];if(v)return row.replace(/>TEKST</,'>'+v+'<');return row;});}
    if(tblIdx===2){return m.replace(/>TEKST</,'>'+(val('price_pln_building')||val('price_pln'))+'<');}
    return m;
  });
  return xml;
}

function processSlide4(xml){
  var city=val('city'); var street=val('street');
  xml=xml.replace(/&#x201E;Miasto&#x201D;|„Miasto"/g,city);
  xml=xml.replace(/UL\. &#x201E;ulica[^<]*/g,street);
  xml=xml.replace(/UL\. „ulica[^<]*/g,street);
  var tblIdx=0;
  xml=xml.replace(/<a:tbl[\s\S]*?<\/a:tbl>/g,function(m){
    tblIdx++;
    if(tblIdx===1){
      var fields=[val('rent_income_pln'),val('service_charge_eur'),val('gross_income_eur')];
      var ri=0;
      return m.replace(/<a:tr[\s\S]*?<\/a:tr>/g,function(row){
        var v=fields[ri++];
        return row.replace(/>5t<|>tak<|>TEKST</,'>'+( v||'')+'<');
      });
    }
    if(tblIdx===2){var f=[val('num_tenants'),val('occupancy')];var ri2=0;return m.replace(/<a:tr[\s\S]*?<\/a:tr>/g,function(row){var v=f[ri2++];if(v)return row.replace(/>TEKST</,'>'+v+'<');return row;});}
    if(tblIdx===3){var f2=[val('noi_eur'),val('yield_pct'),val('price_eur')];var ri3=0;return m.replace(/<a:tr[\s\S]*?<\/a:tr>/g,function(row){var v=f2[ri3++];if(v)return row.replace(/>TEKST</,'>'+v+'<');return row;});}
    return m;
  });
  var rate=val('eur_pln_rate');
  if(rate) xml=xml.replace(/4,24/,rate);
  return xml;
}

function processSlide5(xml){
  var res=val('mpzp_resolution');
  var card=val('terrain_card');
  if(res){
    xml=xml.replace(/UCHWAŁA NR y z dnia xx[^<]*/,res);
    xml=xml.replace(/>UCHWAŁA NR y[^<]*/,'>'+res);
  }
  if(card){
    xml=xml.replace(/&#x201D;Karta terenu&#x201D;\s*/g,card);
    xml=xml.replace(/"Karta terenu"\s*/g,card);
    xml=xml.replace(/>&#x201C;Karta terenu[^<]*/,'>'+card);
  }
  var fnCount=0;
  xml=xml.replace(/>tekst</g,function(){
    fnCount++;
    if(fnCount===1) return '>'+(val('terrain_function')||'')+'<';
    if(fnCount===2) return '>'+(val('excluded_functions')||'')+'<';
    return '>'+'<';
  });
  var tblIdx=0;
  xml=xml.replace(/<a:tbl[\s\S]*?<\/a:tbl>/g,function(m){
    tblIdx++;
    if(tblIdx===1){
      var vals=[val('building_area_min'),val('building_area_max'),val('intensity_min'),val('intensity_max')];
      var ri=0;
      return m.replace(/<a:tr[\s\S]*?<\/a:tr>/g,function(row){var v=vals[ri++];if(v!==undefined)return row.replace(/> ?x</,'>'+( v||'-')+'<');return row;});
    }
    if(tblIdx===2){
      var vals2=[val('height_max'),val('bio_surface_min')];
      var ri2=0;
      return m.replace(/<a:tr[\s\S]*?<\/a:tr>/g,function(row){var v=vals2[ri2++];if(v!==undefined)return row.replace(/> ?x</,'>'+( v||'-')+'<');return row;});
    }
    if(tblIdx===3){
      if(res) m=m.replace(/UCHWAŁA NR y z dnia xx[^\<]*/,res);
      if(card) m=m.replace(/"Karta terenu"\s*/,card);
      return m;
    }
    return m;
  });
  return xml;
}

function removeSlide4FromPresentation(xml){
  var matches=[...xml.matchAll(/<p:sldId[^/]*\/>/g)];
  if(matches.length>=4){
    xml=xml.replace(matches[3][0],'');
  }
  return xml;
}

function setStatus(msg){document.getElementById('status').textContent=msg;}

async function generatePptx(){
  if(!templateBuffer){setStatus('Najpierw wrzuć szablon PPTX');return;}
  var btn=document.getElementById('gen-btn');
  btn.disabled=true;btn.textContent='Generowanie...';
  setStatus('');
  try{
    var zip=await JSZip.loadAsync(templateBuffer);
    var processors={
      'ppt/slides/slide1.xml':processSlide1,
      'ppt/slides/slide2.xml':processSlide2,
      'ppt/slides/slide3.xml':processSlide3,
      'ppt/slides/slide5.xml':processSlide5,
    };
    if(slide4Active) processors['ppt/slides/slide4.xml']=processSlide4;
    for(var path in processors){
      var file=zip.file(path);
      if(file){
        var xml=await file.async('string');
        xml=processors[path](xml);
        zip.file(path,xml);
      }
    }
    if(!slide4Active){
      var presFile=zip.file('ppt/presentation.xml');
      if(presFile){
        var presXml=await presFile.async('string');
        presXml=removeSlide4FromPresentation(presXml);
        zip.file('ppt/presentation.xml',presXml);
      }
    }
    var blob=await zip.generateAsync({type:'blob'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    var city=val('city').replace(/\s/g,'_')||'Obiekt';
    a.href=url;a.download='Oferta_'+city+'.pptx';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus('Pobrano!');
    setTimeout(function(){setStatus('');},3000);
  }catch(err){
    console.error(err);
    setStatus('Błąd: '+err.message);
  }
  btn.disabled=false;btn.innerHTML='<i class="ti ti-download" aria-hidden="true"></i> Generuj PPTX';
}
</script>
